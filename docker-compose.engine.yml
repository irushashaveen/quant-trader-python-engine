services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quant-trader-network

  python-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env.docker
    depends_on:
      - redis
    networks:
      - quant-trader-network

volumes:
  redis_data:

networks:
  quant-trader-network:
    name: quant-trader-network
